<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Liveware Sample</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; background: #f5f6fa; }
    .card { background: #fff; border-radius: 16px; padding: 32px; max-width: 420px; width: 90%;
            box-shadow: 0 8px 30px rgba(0,0,0,.08); border-top: 6px solid var(--theme, #4f7cff); }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { color: #555; line-height: 1.6; }
    .row { display: flex; gap: 8px; margin-top: 20px; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer;
             background: var(--theme, #4f7cff); color: #fff; font-size: 15px; }
    input { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 15px; }
    .hint { font-size: 12px; color: #999; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title"></h1>
    <p id="body"></p>
    <div class="row">
      <button id="like">👍 赞一下</button>
    </div>
    <div class="row">
      <input id="note" placeholder="给 agent 留句话…" />
      <button id="send">发送</button>
    </div>
    <p class="hint">页面由你的 agent 实时控制：在聊天里让它改标题、正文或主题色。</p>
  </div>
  <script src="/app.js"></script>
</body>
</html>
